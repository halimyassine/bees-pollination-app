<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bees Pollination</title>
  <meta name="description" content="A simple AI image generator powered by Pollinations.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <section class="card">
      <div class="brand">
        <div class="bee">🐝</div>
        <div>
          <h1>Bees Pollination</h1>
          <p>Simple AI image generation powered by Pollinations.</p>
        </div>
      </div>

      <div id="status" class="status">Connect your Pollinations account to begin.</div>

      <button id="connectBtn" class="primary">Connect Pollinations</button>

      <label for="prompt">Describe your image</label>
      <textarea id="prompt" rows="5" placeholder="A cozy cabin in an enchanted forest at golden hour..."></textarea>

      <button id="generateBtn" class="primary" disabled>Generate Image</button>

      <div id="loading" class="loading" hidden>Generating...</div>
      <div id="result" class="result" hidden>
        <img id="generatedImage" alt="Generated by Pollinations">
        <a id="downloadBtn" class="secondary" download="bees-pollination.png">Download image</a>
      </div>

      <p class="note">
        Bees Pollination uses Pollinations BYOP authorization. Your Pollen stays under your control.
      </p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
